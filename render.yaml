services:
  - type: web
    name: project-tracker
    env: python
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: project-tracker-db
          property: connectionString
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: CORS_ORIGINS
        value: "[]"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: project-tracker-db
    plan: free
